<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NFC Manager</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
    background:#f4f6fa;
    color:#111827
}

header{
    background:#111827;
    color:white;
    padding:20px
}

header h1{margin:0 0 5px}
header p{margin:0;opacity:.7}

main{
    max-width:1100px;
    margin:auto;
    padding:18px
}

.hidden{display:none!important}

.card-box{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 10px #0000000d
}

input,textarea,button{
    width:100%;
    padding:12px;
    border-radius:10px;
    font-size:15px
}

input,textarea{
    border:1px solid #d1d5db;
    margin:6px 0 12px
}

textarea{min-height:90px}

button{
    border:0;
    background:#2563eb;
    color:white;
    font-weight:600;
    margin-top:8px;
    cursor:pointer
}

button.secondary{background:#374151}

button.danger{background:#dc2626}

button.small{
    width:auto;
    padding:8px 12px
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:12px;
    border-radius:10px;
    margin-bottom:12px
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px
}

.nfc{
    background:white;
    border:2px solid #d1d5db;
    border-radius:15px;
    padding:16px;
    min-height:130px
}

.nfc.used{
    border-color:#2563eb;
    background:#eff6ff
}

.nfc h3{
    margin:0 0 12px
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e5e7eb;
    font-size:12px
}

.used .badge{
    background:#2563eb;
    color:white
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px
}

.stat{
    background:white;
    padding:15px;
    border-radius:14px;
    text-align:center
}

.stat strong{
    display:block;
    font-size:25px;
    margin-top:5px
}

.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    margin-bottom:15px
}

@media(min-width:700px){
    .grid{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>

<body>

<header>
<h1>📱 NFC Manager</h1>
<p>Gestion de tes cartes NFC</p>
</header>

<main>

<!-- ================= CONNEXION ================= -->

<section id="loginPage">

<div class="card-box">

<h2>🔐 Connexion</h2>

<div id="loginError" class="error hidden"></div>

<label>Email</label>
<input
id="email"
type="email"
placeholder="email@example.com"
>

<label>Mot de passe</label>
<input
id="password"
type="password"
placeholder="Mot de passe"
>

<button onclick="login()">
Se connecter
</button>

</div>

</section>


<!-- ================= ADMIN ================= -->

<section id="adminPage" class="hidden">

<div class="topbar">

<h2>👑 Administration</h2>

<button
class="small secondary"
onclick="logout()">
Déconnexion
</button>

</div>

<div id="adminMessage"></div>

<div class="stats">

<div class="stat">
Total
<strong id="totalCards">0</strong>
</div>

<div class="stat">
Utilisées
<strong id="usedCards">0</strong>
</div>

<div class="stat">
Disponibles
<strong id="freeCards">0</strong>
</div>

</div>


<!-- CREER PROFIL -->

<div class="card-box">

<h2>👤 Créer un profil commerçant</h2>

<p>
Entre l'ID du compte Supabase du commerçant.
</p>

<label>ID utilisateur</label>

<input
id="clientId"
placeholder="UUID du compte"
>

<label>Nom du commerce</label>

<input
id="businessName"
placeholder="Ex : Maestro Dunkerque"
>

<button onclick="createClientProfile()">
Créer le profil
</button>

</div>


<!-- ATTRIBUER CARTE -->

<div class="card-box">

<h2>🎫 Attribuer une carte</h2>

<label>Numéro de carte</label>

<input
id="assignCardId"
type="number"
min="1"
max="100"
placeholder="Ex : 1"
>

<label>ID du commerçant</label>

<input
id="assignOwnerId"
placeholder="UUID du commerçant"
>

<button onclick="assignCard()">
Attribuer la carte
</button>

</div>


<!-- TOUTES LES CARTES -->

<div class="card-box">

<h2>🎫 Toutes les cartes</h2>

<div
id="adminCards"
class="grid">
</div>

</div>

</section>


<!-- ================= CLIENT ================= -->

<section id="clientPage" class="hidden">

<div class="topbar">

<h2 id="clientName">
🏪 Mon espace
</h2>

<button
class="small secondary"
onclick="logout()">
Déconnexion
</button>

</div>

<div id="clientMessage"></div>

<div class="card-box">

<h2>🎫 Mes cartes</h2>

<div
id="clientCards"
class="grid">
</div>

</div>

</section>


<!-- ================= NFC PUBLIC ================= -->

<section id="nfcPage" class="hidden">

<div
class="card-box"
style="text-align:center">

<h2 id="nfcShop">
📱 NFC Manager
</h2>

<p id="nfcDescription">
Chargement...
</p>

</div>

</section>

</main>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://epkgzolkmzjyfexhjons.supabase.co";

const SUPABASE_KEY =
"sb_publishable_h_A5w3Kxi2G1xaMVdG8o4Q_CR2g4iAq";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   OUTILS
===================================================== */

function show(id){
    document.getElementById(id)
    .classList.remove("hidden");
}

function hide(id){
    document.getElementById(id)
    .classList.add("hidden");
}

function message(id,text,type="success"){

    const el =
        document.getElementById(id);

    el.className = type;
    el.textContent = text;
}


/* =====================================================
   CONNEXION
===================================================== */

async function login(){

    const email =
        document.getElementById("email")
        .value.trim();

    const password =
        document.getElementById("password")
        .value;

    hide("loginError");

    if(!email || !password){

        message(
            "loginError",
            "Entre ton email et ton mot de passe.",
            "error"
        );

        return;
    }

    const {data,error} =
        await supabaseClient.auth
        .signInWithPassword({
            email:email,
            password:password
        });

    if(error){

        message(
            "loginError",
            error.message,
            "error"
        );

        return;
    }

    await loadUser();
}


/* =====================================================
   DECONNEXION
===================================================== */

async function logout(){

    await supabaseClient.auth.signOut();

    hide("adminPage");
    hide("clientPage");

    show("loginPage");
}


/* =====================================================
   UTILISATEUR
===================================================== */

async function loadUser(){

    const {
        data:{user}
    } =
        await supabaseClient.auth
        .getUser();

    if(!user){

        show("loginPage");

        return;
    }


    const {data:profile,error} =
        await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id",user.id)
        .single();


    if(error){

        message(
            "loginError",
            "Profil introuvable.",
            "error"
        );

        return;
    }


    hide("loginPage");


    if(profile.role === "admin"){

        show("adminPage");

        await loadAdmin();

    }else{

        show("clientPage");

        document.getElementById(
            "clientName"
        ).textContent =
            "🏪 " +
            (
                profile.business_name ||
                "Mon espace"
            );

        await loadClient(user.id);
    }
}


/* =====================================================
   ADMIN — CHARGER LES CARTES
===================================================== */

async function loadAdmin(){

    const {data:cards,error} =
        await supabaseClient
        .from("nfc_cards")
        .select("*")
        .order("id");


    if(error){

        message(
            "adminMessage",
            error.message,
            "error"
        );

        return;
    }


    const used =
        cards.filter(
            c => c.status === "used"
        ).length;


    document.getElementById(
        "totalCards"
    ).textContent =
        cards.length;


    document.getElementById(
        "usedCards"
    ).textContent =
        used;


    document.getElementById(
        "freeCards"
    ).textContent =
        cards.length - used;


    const container =
        document.getElementById(
            "adminCards"
        );


    container.innerHTML = "";


    cards.forEach(card => {

        const div =
            document.createElement("div");

        div.className =
            "nfc " +
            (
                card.status === "used"
                ? "used"
                : ""
            );


        const number =
            String(card.id)
            .padStart(5,"0");


        div.innerHTML = `

            <h3>#${number}</h3>

            <span class="badge">

            ${
                card.status === "used"
                ? "🔵 Utilisée"
                : "⚪ Disponible"
            }

            </span>

            <p>
            ${
                card.shop_name ||
                "Aucun commerce"
            }
            </p>

            <small>
            ${
                card.owner_id
                ? "👤 Attribuée"
                : "📦 Disponible"
            }
            </small>

        `;


        container.appendChild(div);

    });
}


/* =====================================================
   CREER PROFIL CLIENT
===================================================== */

async function createClientProfile(){

    const id =
        document.getElementById(
            "clientId"
        ).value.trim();


    const name =
        document.getElementById(
            "businessName"
        ).value.trim();


    if(!id || !name){

        message(
            "adminMessage",
            "Remplis tous les champs.",
            "error"
        );

        return;
    }


    const {error} =
        await supabaseClient
        .rpc(
            "create_client_profile",
            {
                client_id:id,
                client_business_name:name
            }
        );


    if(error){

        message(
            "adminMessage",
            error.message,
            "error"
        );

        return;
    }


    message(
        "adminMessage",
        "✅ Profil commerçant créé !"
    );


    document.getElementById(
        "clientId"
    ).value = "";


    document.getElementById(
        "businessName"
    ).value = "";
}


/* =====================================================
   ATTRIBUER CARTE
===================================================== */

async function assignCard(){

    const id =
        Number(
            document.getElementById(
                "assignCardId"
            ).value
        );


    const owner =
        document.getElementById(
            "assignOwnerId"
        ).value.trim();


    if(!id || !owner){

        message(
            "adminMessage",
            "Remplis tous les champs.",
            "error"
        );

        return;
    }


    const {error} =
        await supabaseClient
        .from("nfc_cards")
        .update({
            owner_id:owner
        })
        .eq("id",id);


    if(error){

        message(
            "adminMessage",
            error.message,
            "error"
        );

        return;
    }


    message(
        "adminMessage",
        "✅ Carte attribuée !"
    );


    document.getElementById(
        "assignCardId"
    ).value = "";


    document.getElementById(
        "assignOwnerId"
    ).value = "";


    await loadAdmin();
}


/* =====================================================
   CLIENT — CARTES
===================================================== */

async function loadClient(userId){

    const {data:cards,error} =
        await supabaseClient
        .from("nfc_cards")
        .select("*")
        .eq("owner_id",userId)
        .order("id");


    if(error){

        message(
            "clientMessage",
            error.message,
            "error"
        );

        return;
    }


    const container =
        document.getElementById(
            "clientCards"
        );


    container.innerHTML = "";


    if(!cards.length){

        container.innerHTML =
            "<p>Aucune carte attribuée.</p>";

        return;
    }


    cards.forEach(card => {

        const div =
            document.createElement("div");


        div.className =
            "nfc " +
            (
                card.status === "used"
                ? "used"
                : ""
            );


        const number =
            String(card.id)
            .padStart(5,"0");


        div.innerHTML = `

            <h3>#${number}</h3>

            <span class="badge">

            ${
                card.status === "used"
                ? "🔵 Utilisée"
                : "⚪ Disponible"
            }

            </span>

            <p>
            ${
                card.shop_name ||
                "Commerce non configuré"
            }
            </p>

            <button
            onclick="editCard(${card.id})">

            ✏️ Modifier

            </button>

        `;


        container.appendChild(div);

    });
}


/* =====================================================
   MODIFIER CARTE
===================================================== */

async function editCard(id){

    const {data:card,error} =
        await supabaseClient
        .from("nfc_cards")
        .select("*")
        .eq("id",id)
        .single();


    if(error){

        alert(error.message);

        return;
    }


    const shop =
        prompt(
            "Nom du commerce :",
            card.shop_name || ""
        );


    if(shop === null)return;


    const link =
        prompt(
            "Lien Google Avis :",
            card.google_review_url || ""
        );


    if(link === null)return;


    const description =
        prompt(
            "Description :",
            card.description || ""
        );


    if(description === null)return;


    const {error:updateError} =
        await supabaseClient
        .from("nfc_cards")
        .update({

            shop_name:shop,

            google_review_url:link,

            description:description,

            status:"used",

            updated_at:
                new Date().toISOString()

        })
        .eq("id",id);


    if(updateError){

        alert(updateError.message);

        return;
    }


    alert(
        "✅ Carte enregistrée !"
    );


    const {
        data:{user}
    } =
        await supabaseClient.auth
        .getUser();


    await loadClient(user.id);
}


/* =====================================================
   PAGE PUBLIQUE NFC
===================================================== */

async function loadNFC(){

    const path =
        window.location.pathname;


    const match =
        path.match(
            /\/c\/(\d+)/
        );


    if(!match)return false;


    const id =
        Number(match[1]);


    hide("loginPage");
    hide("adminPage");
    hide("clientPage");

    show("nfcPage");


    const {data:card,error} =
        await supabaseClient
        .from("nfc_cards")
        .select(
            "id,shop_name,google_review_url,description"
        )
        .eq("id",id)
        .single();


    if(error || !card){

        document.getElementById(
            "nfcShop"
        ).textContent =
            "❌ Carte introuvable";


        document.getElementById(
            "nfcDescription"
        ).textContent =
            "Cette carte n'existe pas.";


        return true;
    }


    document.getElementById(
        "nfcShop"
    ).textContent =
        card.shop_name ||
        "NFC Manager";


    document.getElementById(
        "nfcDescription"
    ).textContent =
        card.description ||
        "Redirection vers Google...";


    if(card.google_review_url){

        setTimeout(
            function(){

                window.location.href =
                    card.google_review_url;

            },
            1200
        );

    }else{

        document.getElementById(
            "nfcDescription"
        ).textContent =
            "Cette carte n'est pas encore configurée.";

    }


    return true;
}


/* =====================================================
   DEMARRAGE
===================================================== */

(async function(){

    const isNFC =
        await loadNFC();


    if(isNFC)return;


    const {
        data:{session}
    } =
        await supabaseClient
        .auth
        .getSession();


    if(session){

        await loadUser();

    }else{

        show("loginPage");

    }

})();

</script>

</body>
</html>
